name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ALTRunNext.exe dist/ALTRunNext.exe
          Copy-Item config/*.example.* dist/
          Copy-Item docs/CONFIG_SCHEMA.md dist/CONFIG_SCHEMA.md
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath ALTRunNext-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ALTRunNext-${{ matrix.arch }}
          path: ALTRunNext-${{ matrix.arch }}.zip
