name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        run: python3 scripts/verify_version.py
      - name: Verify release contract
        run: python3 scripts/verify_release_contract.py
      - name: Verify release tag guard
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/verify_tag_version.py "v$VERSION"
          if python3 scripts/verify_tag_version.py "v0.0.0"; then
            echo "Mismatched tag unexpectedly passed validation."
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Verify portable runtime
        shell: pwsh
        run: |
          $pinyinDlls = @(Get-ChildItem build -Recurse -File -Filter "cpp-pinyin.dll" -ErrorAction SilentlyContinue)
          if ($pinyinDlls.Count -ne 0) {
            $pinyinDlls | ForEach-Object { Write-Host $_.FullName }
            throw "cpp-pinyin.dll was produced. ALTRun Next must link cpp-pinyin statically."
          }

          $unexpectedDlls = @(Get-ChildItem build/Release -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -ne 0) {
            $unexpectedDlls | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected runtime DLL found beside ALTRunNext.exe."
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ALTRunNext.exe dist/ALTRunNext.exe
          Copy-Item build/Release/Update.exe dist/Update.exe
          Copy-Item build/Release/Uninstall.exe dist/Uninstall.exe
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          Copy-Item config/*.example.* dist/
          Copy-Item docs/CONFIG_SCHEMA.md dist/CONFIG_SCHEMA.md
          Copy-Item docs/DESKTOP_VALIDATION.md dist/DESKTOP_VALIDATION.md
          Copy-Item docs/V0.5_RC_VALIDATION.md dist/V0.5_RC_VALIDATION.md
          Copy-Item docs/V0.6_RC_VALIDATION.md dist/V0.6_RC_VALIDATION.md
          Copy-Item docs/V0.7_BETA_VALIDATION.md dist/V0.7_BETA_VALIDATION.md
          Copy-Item docs/V0.7_RC_VALIDATION.md dist/V0.7_RC_VALIDATION.md
          Copy-Item docs/EVERYTHING_COMPATIBILITY.md dist/EVERYTHING_COMPATIBILITY.md
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath ALTRunNext-${{ matrix.arch }}.zip

      - name: Verify package contract
        shell: pwsh
        run: '& ./scripts/verify_package.ps1 -Archive "ALTRunNext-${{ matrix.arch }}.zip"'

      - name: Verify packaged x64 runtime startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: '& ./scripts/verify_runtime_smoke.ps1 -Archive "ALTRunNext-x64.zip"'

      - uses: actions/upload-artifact@v4
        with:
          name: ALTRunNext-${{ matrix.arch }}
          path: ALTRunNext-${{ matrix.arch }}.zip


  windows-provider-smoke:
    name: Windows desktop/runtime smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure provider smoke tests
        shell: pwsh
        run: cmake -S . -B build-smoke -A x64 -DBUILD_TESTING=ON
      - name: Build Windows smoke tests
        shell: pwsh
        run: cmake --build build-smoke --config Release --target ALTRunNextUpdater ALTRunNextUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_ipc_runtime_tests update_policy_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests --parallel
      - name: Run Windows smoke tests
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_ipc_runtime_tests|update_policy_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests)$" --output-on-failure

  windows-compat:
    name: Windows 10 API baseline
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 compatibility build
        shell: pwsh
        run: cmake -S . -B build-compat -A x64 -DBUILD_TESTING=ON
      - name: Build x64 compatibility target
        shell: pwsh
        run: cmake --build build-compat --config Release --target ALTRunNext ALTRunNextUpdater ALTRunNextUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_ipc_runtime_tests update_policy_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests --parallel
      - name: Verify compatibility artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build-compat/Release/ALTRunNext.exe)) {
            throw "Windows compatibility build did not produce ALTRunNext.exe."
          }
          if (-not (Test-Path build-compat/Release/Update.exe)) {
            throw "Windows compatibility build did not produce Update.exe."
          }
          if (-not (Test-Path build-compat/Release/Uninstall.exe)) {
            throw "Windows compatibility build did not produce Uninstall.exe."
          }
      - name: Run Windows compatibility smoke
        shell: pwsh
        run: ctest --test-dir build-compat -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_ipc_runtime_tests|update_policy_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests)$" --output-on-failure

  development-release:
    name: Publish rolling development prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-core, build-windows, windows-provider-smoke, windows-compat]
    runs-on: ubuntu-latest
    concurrency:
      group: altrun-development-release
      # Do not kill a release while gh is creating/uploading it. An interrupted
      # publish can leave a draft release whose public asset URL returns 404.
      # Stale queued runs are rejected by the main-SHA checks below instead.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check this is still the latest main commit
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip publishing this run."
          fi

      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          find artifacts -type f -name 'ALTRunNext-x64.zip' -exec cp {} ALTRunNext-x64.zip \;
          find artifacts -type f -name 'ALTRunNext-ARM64.zip' -exec cp {} ALTRunNext-ARM64.zip \;
          test -f ALTRunNext-x64.zip
          test -f ALTRunNext-ARM64.zip
          sha256sum ALTRunNext-x64.zip ALTRunNext-ARM64.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/generate_update_manifest.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --checksums SHA256SUMS.txt \
            --output update-manifest.json
          python3 -m json.tool update-manifest.json >/dev/null
          cat update-manifest.json

      - name: Publish dev-latest prerelease
        id: publish-dev
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The job can wait in the release concurrency queue. Re-check main
          # immediately before mutating the rolling release so an older green
          # build can never overwrite a newer one.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skip dev-latest publication."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force

          # Draft releases are intentionally found through the authenticated
          # releases collection. GET /releases/tags/dev-latest returns 404 for
          # a draft, which is exactly the client-visible failure this guards.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"

          if [[ -n "$RELEASE_ID" ]]; then
            echo "Reusing dev-latest release id $RELEASE_ID."

            # Recover any orphan draft first so the rolling update endpoint
            # stays public while assets are replaced. Manifest is uploaded
            # last, so clients either see the previous coherent manifest or
            # the new coherent manifest.
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              -F prerelease=true \
              -f name="ALTRun Next Development Build" \
              -f body="Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build." \
              >/dev/null

            gh release upload dev-latest \
              ALTRunNext-x64.zip \
              ALTRunNext-ARM64.zip \
              SHA256SUMS.txt \
              --clobber
            gh release upload dev-latest \
              update-manifest.json \
              --clobber
          else
            # Bootstrap as an explicit draft, upload all assets, then publish
            # via API. This makes the draft -> public transition observable
            # and testable instead of relying on gh release create internals.
            gh release create dev-latest \
              ALTRunNext-x64.zip \
              ALTRunNext-ARM64.zip \
              SHA256SUMS.txt \
              update-manifest.json \
              --draft \
              --prerelease \
              --title "ALTRun Next Development Build" \
              --notes "Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build."

            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"
            test -n "$RELEASE_ID"
          fi

          # Explicitly publish after every upload path. The CI must never
          # consider dev-latest healthy merely because gh exited successfully.
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f name="ALTRun Next Development Build" \
            -f body="Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build." \
            >/dev/null

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify dev-latest public update contract
        if: steps.publish-dev.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_ID="${{ steps.publish-dev.outputs.release_id }}"

          # Authenticated state verification catches draft/prerelease mistakes.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > authenticated-dev-release.json
          jq -e \
            --arg tag "dev-latest" \
            '.tag_name == $tag and .draft == false and .prerelease == true' \
            authenticated-dev-release.json \
            >/dev/null

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/dev-latest" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"

          jq -e \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            '.schemaVersion == 1 and .version == $version and .commit == $commit and .prerelease == true' \
            update-manifest.json \
            >/dev/null

          # The authenticated check above is authoritative for
          # draft=false/prerelease=true. Installed Development clients do not
          # consume the GitHub Release API; they anonymously download this
          # exact manifest asset. Verify that client-facing endpoint directly.
          #
          # Do not add an anonymous api.github.com metadata request here:
          # shared hosted-runner IPs can exhaust GitHub's unauthenticated API
          # rate limit and return HTTP 403 even while the public asset is
          # healthy, which would turn an external rate limit into a false red.
          PUBLIC_MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/update-manifest.json"

          rm -f public-update-manifest.json
          verified=false
          for attempt in $(seq 1 20); do
            if curl --location --fail --silent --show-error \
                "$PUBLIC_MANIFEST_URL" \
                -o public-update-manifest.json &&
               cmp -s update-manifest.json public-update-manifest.json; then
              verified=true
              break
            fi

            rm -f public-update-manifest.json
            sleep 3
          done

          if [[ "$verified" != "true" ]]; then
            echo "dev-latest manifest did not become anonymously downloadable and byte-identical within the verification window."
            exit 1
          fi

          echo "dev-latest release state is valid and its manifest is anonymously downloadable and coherent."

      - name: Publish versioned release
        if: steps.publish-dev.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          TAG="v$VERSION"
          IS_PRERELEASE=false

          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE=true
          fi

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"

          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            if [[ "$IS_PRERELEASE" != "true" ]]; then
              echo "Stable tag $TAG already exists at $REMOTE_SHA; stable releases are immutable."
              exit 1
            fi

            echo "Refreshing active prerelease $TAG from $REMOTE_SHA to $GITHUB_SHA."
            gh release delete "$TAG" --yes --cleanup-tag || true
            git tag -f "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG" --force
          elif [[ -z "$REMOTE_SHA" ]]; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already points to the current commit and its release exists."
            exit 0
          fi

          EXTRA_ARGS=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            ALTRunNext-x64.zip \
            ALTRunNext-ARM64.zip \
            SHA256SUMS.txt \
            update-manifest.json \
            "${EXTRA_ARGS[@]}" \
            --title "ALTRun Next $TAG" \
            --notes "Versioned build created automatically from commit $GITHUB_SHA."
