name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded builds only for the same PR. Non-PR runs use unique
# groups so main releases and manually dispatched builds are never cancelled here.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Asterun branding
        run: python3 scripts/verify_branding.py
      - name: Verify version metadata
        run: python3 scripts/verify_version.py
      - name: Verify release contract
        run: python3 scripts/verify_release_contract.py
      - name: Verify release publisher syntax
        shell: bash
        run: bash -n scripts/publish_versioned_release.sh
      - name: Verify release tag guard
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/verify_tag_version.py "v$VERSION"
          if python3 scripts/verify_tag_version.py "v0.0.0"; then
            echo "Mismatched tag unexpectedly passed validation."
            exit 1
          fi
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Verify portable runtime
        shell: pwsh
        run: |
          $pinyinDlls = @(Get-ChildItem build -Recurse -File -Filter "cpp-pinyin.dll" -ErrorAction SilentlyContinue)
          if ($pinyinDlls.Count -ne 0) {
            $pinyinDlls | ForEach-Object { Write-Host $_.FullName }
            throw "cpp-pinyin.dll was produced. Asterun must link cpp-pinyin statically."
          }

          $unexpectedDlls = @(Get-ChildItem build/Release -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -ne 0) {
            $unexpectedDlls | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected runtime DLL found beside Asterun.exe."
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/Asterun.exe dist/Asterun.exe
          Copy-Item build/Release/Update.exe dist/Update.exe
          Copy-Item build/Release/Uninstall.exe dist/Uninstall.exe
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          # Keep the end-user portable archive intentionally small. Validation,
          # schema and example files remain in the repository; the runtime does
          # not consume them and creates its data directory on first launch.
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath Asterun-${{ matrix.arch }}.zip

      - name: Verify package contract
        shell: pwsh
        run: '& ./scripts/verify_package.ps1 -Archive "Asterun-${{ matrix.arch }}.zip"'

      - name: Verify packaged x64 runtime startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: '& ./scripts/verify_runtime_smoke.ps1 -Archive "Asterun-x64.zip"'

      - uses: actions/upload-artifact@v4
        with:
          name: Asterun-${{ matrix.arch }}
          path: Asterun-${{ matrix.arch }}.zip


  windows-provider-smoke:
    name: Windows desktop/runtime smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure provider smoke tests
        shell: pwsh
        run: cmake -S . -B build-smoke -A x64 -DBUILD_TESTING=ON
      - name: Build Windows smoke tests
        shell: pwsh
        run: cmake --build build-smoke --config Release --target AsterunUpdater AsterunUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_http_transport_tests everything_http_runtime_tests update_http_transport_tests update_http_runtime_tests everything_ipc_runtime_tests update_policy_tests update_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests feedback_runtime_tests uninstall_runtime_tests window_presentation_runtime_tests app_lifecycle_runtime_tests launcher_resource_runtime_tests ui_listview_failure_tests archive_extractor_tests windows_command_line_tests --parallel
      - name: Measure Launcher Show refreshes
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release -R "^launcher_resource_runtime_tests$" --verbose
      - name: Run Windows smoke tests
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_http_transport_tests|everything_http_runtime_tests|update_http_transport_tests|update_http_runtime_tests|everything_ipc_runtime_tests|update_policy_tests|update_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests|feedback_runtime_tests|uninstall_runtime_tests|window_presentation_runtime_tests|app_lifecycle_runtime_tests|launcher_resource_runtime_tests|ui_listview_failure_tests|archive_extractor_tests|windows_command_line_tests)$" --output-on-failure

  windows-compat:
    name: Windows 10 API baseline
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 compatibility build
        shell: pwsh
        run: cmake -S . -B build-compat -A x64 -DBUILD_TESTING=ON
      - name: Build x64 compatibility target
        shell: pwsh
        run: cmake --build build-compat --config Release --target Asterun AsterunUpdater AsterunUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_http_transport_tests everything_http_runtime_tests update_http_transport_tests update_http_runtime_tests everything_ipc_runtime_tests update_policy_tests update_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests feedback_runtime_tests uninstall_runtime_tests window_presentation_runtime_tests app_lifecycle_runtime_tests launcher_resource_runtime_tests ui_listview_failure_tests archive_extractor_tests windows_command_line_tests --parallel
      - name: Verify compatibility artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build-compat/Release/Asterun.exe)) {
            throw "Windows compatibility build did not produce Asterun.exe."
          }
          if (-not (Test-Path build-compat/Release/Update.exe)) {
            throw "Windows compatibility build did not produce Update.exe."
          }
          if (-not (Test-Path build-compat/Release/Uninstall.exe)) {
            throw "Windows compatibility build did not produce Uninstall.exe."
          }
      - name: Measure Launcher Show refreshes
        shell: pwsh
        run: ctest --test-dir build-compat -C Release -R "^launcher_resource_runtime_tests$" --verbose
      - name: Run Windows compatibility smoke
        shell: pwsh
        run: ctest --test-dir build-compat -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_http_transport_tests|everything_http_runtime_tests|update_http_transport_tests|update_http_runtime_tests|everything_ipc_runtime_tests|update_policy_tests|update_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests|feedback_runtime_tests|uninstall_runtime_tests|window_presentation_runtime_tests|app_lifecycle_runtime_tests|launcher_resource_runtime_tests|ui_listview_failure_tests|archive_extractor_tests|windows_command_line_tests)$" --output-on-failure

  development-release:
    name: Publish rolling development prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-core, build-windows, windows-provider-smoke, windows-compat]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: asterun-development-release
      # Do not kill a release while gh is creating/uploading it. An interrupted
      # publish can leave a draft release whose public asset URL returns 404.
      # Stale queued runs are rejected by the main-SHA checks below instead.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check this is still the latest main commit
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip publishing this run."
          fi

      - uses: actions/download-artifact@v4
        if: steps.current.outputs.publish == 'true'
        with:
          path: artifacts

      - name: Prepare release assets
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          find artifacts -type f -name 'Asterun-x64.zip' -exec cp {} Asterun-x64.zip \;
          find artifacts -type f -name 'Asterun-ARM64.zip' -exec cp {} Asterun-ARM64.zip \;
          test -f Asterun-x64.zip
          test -f Asterun-ARM64.zip
          sha256sum Asterun-x64.zip Asterun-ARM64.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/generate_update_manifest.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --checksums SHA256SUMS.txt \
            --output update-manifest.json
          python3 -m json.tool update-manifest.json >/dev/null
          cat update-manifest.json

      - name: Publish dev-latest prerelease
        id: publish-dev
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # The job can wait in the release concurrency queue. Re-check main
          # immediately before mutating the rolling release so an older green
          # build can never overwrite a newer one.
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skip dev-latest publication."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag -f dev-latest "$GITHUB_SHA"
          git push origin refs/tags/dev-latest --force

          # Draft releases are intentionally found through the authenticated
          # releases collection. GET /releases/tags/dev-latest returns 404 for
          # a draft, which is exactly the client-visible failure this guards.
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"

          if [[ -n "$RELEASE_ID" ]]; then
            echo "Reusing dev-latest release id $RELEASE_ID."

            # Recover any orphan draft first so the rolling update endpoint
            # stays public while assets are replaced. Manifest is uploaded
            # last, so clients either see the previous coherent manifest or
            # the new coherent manifest.
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false \
              -F prerelease=true \
              -f name="Asterun Development Build" \
              -f body="Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build." \
              >/dev/null

            gh release upload dev-latest \
              Asterun-x64.zip \
              Asterun-ARM64.zip \
              SHA256SUMS.txt \
              --clobber
            gh release upload dev-latest \
              update-manifest.json \
              --clobber
          else
            # Bootstrap as an explicit draft, upload all assets, then publish
            # via API. This makes the draft -> public transition observable
            # and testable instead of relying on gh release create internals.
            gh release create dev-latest \
              Asterun-x64.zip \
              Asterun-ARM64.zip \
              SHA256SUMS.txt \
              update-manifest.json \
              --draft \
              --prerelease \
              --title "Asterun Development Build" \
              --notes "Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build."

            RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == "dev-latest") | .id' | head -n 1)"
            test -n "$RELEASE_ID"
          fi

          # Explicitly publish after every upload path. The CI must never
          # consider dev-latest healthy merely because gh exited successfully.
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f name="Asterun Development Build" \
            -f body="Rolling prerelease built from main at commit $GITHUB_SHA. This release is replaced automatically after every successful main build." \
            >/dev/null

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Verify dev-latest public update contract
        if: steps.publish-dev.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '\r\n' < VERSION)"
          RELEASE_ID="${{ steps.publish-dev.outputs.release_id }}"

          # dev-latest is always a GitHub prerelease Release, while the manifest\n          # prerelease field describes VERSION itself (stable 1.0.0 => false).\n          # Authenticated state verification catches Release-state mistakes.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > authenticated-dev-release.json
          jq -e \
            --arg tag "dev-latest" \
            '.tag_name == $tag and .draft == false and .prerelease == true and
             ([.assets[].name] | sort) ==
             (["Asterun-ARM64.zip", "Asterun-x64.zip", "SHA256SUMS.txt", "update-manifest.json"] | sort)' \
            authenticated-dev-release.json \
            >/dev/null

          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/dev-latest" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"

          jq -e \
            --arg version "$VERSION" \
            --arg commit "$GITHUB_SHA" \
            '.schemaVersion == 1 and .version == $version and .commit == $commit and .prerelease == ($version | contains("-"))' \
            update-manifest.json \
            >/dev/null

          # The authenticated check above is authoritative for
          # draft=false/prerelease=true. Installed Development clients do not
          # consume the GitHub Release API; they anonymously download this
          # exact manifest asset. Verify that client-facing endpoint directly.
          #
          # Do not add an anonymous api.github.com metadata request here:
          # shared hosted-runner IPs can exhaust GitHub's unauthenticated API
          # rate limit and return HTTP 403 even while the public asset is
          # healthy, which would turn an external rate limit into a false red.
          PUBLIC_MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/dev-latest/update-manifest.json"

          rm -f public-update-manifest.json
          verified=false
          for attempt in $(seq 1 20); do
            if curl --location --fail --silent --show-error \
                "$PUBLIC_MANIFEST_URL" \
                -o public-update-manifest.json &&
               cmp -s update-manifest.json public-update-manifest.json; then
              verified=true
              break
            fi

            rm -f public-update-manifest.json
            sleep 3
          done

          if [[ "$verified" != "true" ]]; then
            echo "dev-latest manifest did not become anonymously downloadable and byte-identical within the verification window."
            exit 1
          fi

          echo "dev-latest release state is valid and its manifest is anonymously downloadable and coherent."

      # main only maintains the rolling dev-latest prerelease.
      # Immutable versioned releases are published exclusively by release.yml
      # from explicit v* tags, preventing development builds from flooding
      # the Releases page.
