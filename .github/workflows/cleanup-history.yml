name: One-shot repository history cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-history.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete Release objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          while IFS=$'\t' read -r id tag; do
            if [[ "$tag" == "v1.0.0" || "$tag" == "dev-latest" ]]; then
              echo "Keep Release: $tag"
              continue
            fi

            echo "Delete Release: $tag (id=$id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100"               --jq '.[] | [.id, .tag_name] | @tsv'
          )

          echo "Deleted $deleted obsolete Release objects."
          echo "Historical Git tags are intentionally preserved."

      - name: Remove obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          deleted=0
          while IFS= read -r branch; do
            if [[ "$branch" == "main" ]]; then
              echo "Keep branch: main"
              continue
            fi

            echo "Delete branch: $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            deleted=$((deleted + 1))
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100"               --jq '.[].name'
          )

          echo "Deleted $deleted obsolete branches."

      - name: Verify cleanup result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t releases < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100"               --jq '.[].tag_name'
          )
          printf 'Remaining Releases:\n'
          printf '  %s\n' "${releases[@]}"

          if [[ "${#releases[@]}" -ne 2 ]]; then
            echo "Expected exactly two Releases after cleanup."
            exit 1
          fi

          printf '%s\n' "${releases[@]}" | grep -Fxq "v1.0.0"
          printf '%s\n' "${releases[@]}" | grep -Fxq "dev-latest"

          mapfile -t branches < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100"               --jq '.[].name'
          )
          printf 'Remaining branches:\n'
          printf '  %s\n' "${branches[@]}"

          if [[ "${#branches[@]}" -ne 1 || "${branches[0]}" != "main" ]]; then
            echo "Expected main to be the only remaining branch."
            exit 1
          fi

          echo "Repository history cleanup verified."
