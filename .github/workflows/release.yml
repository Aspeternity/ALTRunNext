name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  preflight:
    name: Release tag preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        run: python3 scripts/verify_tag_version.py "$GITHUB_REF_NAME"
      - name: Verify version metadata
        run: python3 scripts/verify_version.py
      - name: Verify release contract
        run: python3 scripts/verify_release_contract.py

  test-core:
    name: Core tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-smoke:
    name: Windows runtime smoke
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows smoke tests
        shell: pwsh
        run: cmake -S . -B build-smoke -A x64 -DBUILD_TESTING=ON
      - name: Build Windows smoke tests
        shell: pwsh
        run: cmake --build build-smoke --config Release --target windows_provider_smoke_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_ipc_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests clipboard_runtime_tests windows_context_runtime_tests --parallel
      - name: Run Windows smoke tests
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release -R "^(windows_provider_smoke_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_ipc_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|clipboard_runtime_tests|windows_context_runtime_tests)$" --output-on-failure

  windows-compat:
    name: Windows 10 API baseline
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 compatibility build
        shell: pwsh
        run: cmake -S . -B build-compat -A x64 -DBUILD_TESTING=ON
      - name: Build x64 compatibility target
        shell: pwsh
        run: cmake --build build-compat --config Release --target ALTRunNext windows_provider_smoke_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_ipc_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests clipboard_runtime_tests windows_context_runtime_tests --parallel
      - name: Verify compatibility artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build-compat/Release/ALTRunNext.exe)) {
            throw "Windows compatibility build did not produce ALTRunNext.exe."
          }
      - name: Run Windows compatibility smoke
        shell: pwsh
        run: ctest --test-dir build-compat -C Release -R "^(windows_provider_smoke_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_ipc_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|clipboard_runtime_tests|windows_context_runtime_tests)$" --output-on-failure

  build:
    name: Package Windows (${{ matrix.arch }})
    needs: preflight
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Verify portable runtime
        shell: pwsh
        run: |
          $pinyinDlls = @(Get-ChildItem build -Recurse -File -Filter "cpp-pinyin.dll" -ErrorAction SilentlyContinue)
          if ($pinyinDlls.Count -ne 0) {
            $pinyinDlls | ForEach-Object { Write-Host $_.FullName }
            throw "cpp-pinyin.dll was produced. ALTRun Next must link cpp-pinyin statically."
          }

          $unexpectedDlls = @(Get-ChildItem build/Release -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -ne 0) {
            $unexpectedDlls | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected runtime DLL found beside ALTRunNext.exe."
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ALTRunNext.exe dist/ALTRunNext.exe
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          Copy-Item config/*.example.* dist/
          Copy-Item docs/CONFIG_SCHEMA.md dist/CONFIG_SCHEMA.md
          Copy-Item docs/DESKTOP_VALIDATION.md dist/DESKTOP_VALIDATION.md
          Copy-Item docs/V0.5_RC_VALIDATION.md dist/V0.5_RC_VALIDATION.md
          Copy-Item docs/EVERYTHING_COMPATIBILITY.md dist/EVERYTHING_COMPATIBILITY.md
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath ALTRunNext-${{ matrix.arch }}.zip

      - name: Verify package contract
        shell: pwsh
        run: '& ./scripts/verify_package.ps1 -Archive "ALTRunNext-${{ matrix.arch }}.zip"'

      - name: Verify packaged x64 runtime startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: '& ./scripts/verify_runtime_smoke.ps1 -Archive "ALTRunNext-x64.zip"'

      - uses: actions/upload-artifact@v4
        with:
          name: ALTRunNext-${{ matrix.arch }}
          path: ALTRunNext-${{ matrix.arch }}.zip

  release:
    needs: [preflight, test-core, windows-smoke, windows-compat, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare checksums
        shell: bash
        run: |
          find artifacts -type f -name 'ALTRunNext-x64.zip' -exec cp {} ALTRunNext-x64.zip \;
          find artifacts -type f -name 'ALTRunNext-ARM64.zip' -exec cp {} ALTRunNext-ARM64.zip \;
          test -f ALTRunNext-x64.zip
          test -f ALTRunNext-ARM64.zip
          sha256sum ALTRunNext-x64.zip ALTRunNext-ARM64.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ALTRun Next ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ALTRunNext-x64.zip
            ALTRunNext-ARM64.zip
            SHA256SUMS.txt
