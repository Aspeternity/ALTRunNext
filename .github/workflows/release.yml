name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release-trigger/v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Release tag preflight
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_ref.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve and guard release trigger
        id: release_ref
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/tags/v*)
              tag="$GITHUB_REF_NAME"
              ;;
            refs/heads/release-trigger/v*)
              tag="${GITHUB_REF_NAME#release-trigger/}"
              git fetch --no-tags origin main:refs/remotes/origin/main
              main_sha="$(git rev-parse origin/main)"
              head_sha="$(git rev-parse HEAD)"
              if [[ "$head_sha" != "$main_sha" ]]; then
                echo "Release trigger must point exactly at current main: trigger=$head_sha main=$main_sha"
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release ref: $GITHUB_REF"
              exit 1
              ;;
          esac

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag derived from ref: $tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Verify Asterun branding
        run: python3 scripts/verify_branding.py
      - name: Verify tag matches VERSION
        run: python3 scripts/verify_tag_version.py "${{ steps.release_ref.outputs.tag }}"
      - name: Verify version metadata
        run: python3 scripts/verify_version.py
      - name: Verify release contract
        run: python3 scripts/verify_release_contract.py
      - name: Verify release publisher syntax
        shell: bash
        run: bash -n scripts/publish_versioned_release.sh

  test-core:
    name: Core tests
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows-smoke:
    name: Windows runtime smoke
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows smoke tests
        shell: pwsh
        run: cmake -S . -B build-smoke -A x64 -DBUILD_TESTING=ON
      - name: Build Windows smoke tests
        shell: pwsh
        run: cmake --build build-smoke --config Release --target AsterunUpdater AsterunUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_ipc_runtime_tests update_policy_tests update_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests feedback_runtime_tests uninstall_runtime_tests window_presentation_runtime_tests archive_extractor_tests windows_command_line_tests --parallel
      - name: Run Windows smoke tests
        shell: pwsh
        run: ctest --test-dir build-smoke -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_ipc_runtime_tests|update_policy_tests|update_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests|feedback_runtime_tests|uninstall_runtime_tests|window_presentation_runtime_tests|archive_extractor_tests|windows_command_line_tests)$" --output-on-failure

  windows-compat:
    name: Windows 10 API baseline
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64 compatibility build
        shell: pwsh
        run: cmake -S . -B build-compat -A x64 -DBUILD_TESTING=ON
      - name: Build x64 compatibility target
        shell: pwsh
        run: cmake --build build-compat --config Release --target Asterun AsterunUpdater AsterunUninstaller windows_provider_smoke_tests launch_target_inspector_tests path_portability_tests user_command_path_update_tests hotkey_registry_tests hotkey_tests hotkey_runtime_tests desktop_validation_tests everything_lifecycle_tests everything_ipc_runtime_tests update_policy_tests update_runtime_tests web_action_tests clipboard_action_tests command_template_tests launcher_action_policy_tests explorer_context_selection_tests upgrade_matrix_tests clipboard_runtime_tests windows_context_runtime_tests feedback_runtime_tests uninstall_runtime_tests window_presentation_runtime_tests archive_extractor_tests windows_command_line_tests --parallel
      - name: Verify compatibility artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build-compat/Release/Asterun.exe)) {
            throw "Windows compatibility build did not produce Asterun.exe."
          }
          if (-not (Test-Path build-compat/Release/Update.exe)) {
            throw "Windows compatibility build did not produce Update.exe."
          }
          if (-not (Test-Path build-compat/Release/Uninstall.exe)) {
            throw "Windows compatibility build did not produce Uninstall.exe."
          }
      - name: Run Windows compatibility smoke
        shell: pwsh
        run: ctest --test-dir build-compat -C Release -R "^(windows_provider_smoke_tests|launch_target_inspector_tests|path_portability_tests|user_command_path_update_tests|hotkey_registry_tests|hotkey_tests|hotkey_runtime_tests|desktop_validation_tests|everything_lifecycle_tests|everything_ipc_runtime_tests|update_policy_tests|update_runtime_tests|web_action_tests|clipboard_action_tests|command_template_tests|launcher_action_policy_tests|explorer_context_selection_tests|upgrade_matrix_tests|clipboard_runtime_tests|windows_context_runtime_tests|feedback_runtime_tests|uninstall_runtime_tests|window_presentation_runtime_tests|archive_extractor_tests|windows_command_line_tests)$" --output-on-failure

  build:
    name: Package Windows (${{ matrix.arch }})
    needs: preflight
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Verify portable runtime
        shell: pwsh
        run: |
          $pinyinDlls = @(Get-ChildItem build -Recurse -File -Filter "cpp-pinyin.dll" -ErrorAction SilentlyContinue)
          if ($pinyinDlls.Count -ne 0) {
            $pinyinDlls | ForEach-Object { Write-Host $_.FullName }
            throw "cpp-pinyin.dll was produced. Asterun must link cpp-pinyin statically."
          }

          $unexpectedDlls = @(Get-ChildItem build/Release -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -ne 0) {
            $unexpectedDlls | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected runtime DLL found beside Asterun.exe."
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/Asterun.exe dist/Asterun.exe
          Copy-Item build/Release/Update.exe dist/Update.exe
          Copy-Item build/Release/Uninstall.exe dist/Uninstall.exe
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          # Keep the end-user portable archive intentionally small. Validation,
          # schema and example files remain in the repository; the runtime does
          # not consume them and creates its data directory on first launch.
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath Asterun-${{ matrix.arch }}.zip

      - name: Verify package contract
        shell: pwsh
        run: '& ./scripts/verify_package.ps1 -Archive "Asterun-${{ matrix.arch }}.zip"'

      - name: Verify packaged x64 runtime startup
        if: matrix.arch == 'x64'
        shell: pwsh
        run: '& ./scripts/verify_runtime_smoke.ps1 -Archive "Asterun-x64.zip"'

      - uses: actions/upload-artifact@v4
        with:
          name: Asterun-${{ matrix.arch }}
          path: Asterun-${{ matrix.arch }}.zip

  release:
    needs: [preflight, test-core, windows-smoke, windows-compat, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f -name 'Asterun-x64.zip' -exec cp {} Asterun-x64.zip \;
          find artifacts -type f -name 'Asterun-ARM64.zip' -exec cp {} Asterun-ARM64.zip \;
          test -f Asterun-x64.zip
          test -f Asterun-ARM64.zip
          sha256sum Asterun-x64.zip Asterun-ARM64.zip > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 2
          sha256sum -c SHA256SUMS.txt
          VERSION="$(tr -d '\r\n' < VERSION)"
          python3 scripts/generate_update_manifest.py \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --checksums SHA256SUMS.txt \
            --output update-manifest.json
          python3 -m json.tool update-manifest.json >/dev/null

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          bash scripts/publish_versioned_release.sh \
            "${{ needs.preflight.outputs.release_tag }}" \
            "$VERSION" \
            "$GITHUB_SHA"
