name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Verify version metadata
        shell: pwsh
        run: python scripts/verify_version.py
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A ${{ matrix.arch }} -DBUILD_TESTING=OFF
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Verify portable runtime
        shell: pwsh
        run: |
          $unexpectedDlls = @(Get-ChildItem build/Release -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($unexpectedDlls.Count -ne 0) {
            $unexpectedDlls | ForEach-Object { Write-Host $_.FullName }
            throw "Unexpected runtime DLL found beside ALTRunNext.exe."
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/ALTRunNext.exe dist/ALTRunNext.exe
          Copy-Item -Recurse build/Release/dict dist/dict
          Copy-Item -Recurse build/Release/third_party dist/third_party
          Copy-Item config/*.example.* dist/
          Copy-Item docs/CONFIG_SCHEMA.md dist/CONFIG_SCHEMA.md
          Copy-Item VERSION dist/VERSION
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath ALTRunNext-${{ matrix.arch }}.zip

      - name: Verify package contract
        shell: pwsh
        run: |
          $archive = "ALTRunNext-${{ matrix.arch }}.zip"
          $verify = "verify-package"
          Expand-Archive -Path $archive -DestinationPath $verify -Force

          $required = @(
            "ALTRunNext.exe",
            "VERSION",
            "README.md",
            "CONFIG_SCHEMA.md",
            "dict",
            "third_party/cpp-pinyin-LICENSE.txt"
          )

          foreach ($entry in $required) {
            if (-not (Test-Path (Join-Path $verify $entry))) {
              throw "Release package is missing required entry: $entry"
            }
          }

          $unexpectedDlls = @(
            Get-ChildItem $verify -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue
          )
          if ($unexpectedDlls.Count -ne 0) {
            throw "Release package contains unexpected runtime DLLs."
          }

          $expectedVersion = (Get-Content VERSION -Raw).Trim()
          $packagedVersion = (Get-Content (Join-Path $verify "VERSION") -Raw).Trim()
          if ($packagedVersion -ne $expectedVersion) {
            throw "Packaged VERSION '$packagedVersion' does not match '$expectedVersion'."
          }

          $semver = [regex]::Match(
            $expectedVersion,
            '^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?

      - uses: actions/upload-artifact@v4
        with:
          name: ALTRunNext-${{ matrix.arch }}
          path: ALTRunNext-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare checksums
        shell: bash
        run: |
          find artifacts -type f -name 'ALTRunNext-x64.zip' -exec cp {} ALTRunNext-x64.zip \;
          find artifacts -type f -name 'ALTRunNext-ARM64.zip' -exec cp {} ALTRunNext-ARM64.zip \;
          test -f ALTRunNext-x64.zip
          test -f ALTRunNext-ARM64.zip
          sha256sum ALTRunNext-x64.zip ALTRunNext-ARM64.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ALTRun Next ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ALTRunNext-x64.zip
            ALTRunNext-ARM64.zip
            SHA256SUMS.txt

          )
          if (-not $semver.Success) {
            throw "Unsupported VERSION format: '$expectedVersion'."
          }

          $major = [int]$semver.Groups[1].Value
          $minor = [int]$semver.Groups[2].Value
          $patch = [int]$semver.Groups[3].Value
          $channel = $semver.Groups[4].Value
          $channelNumber = if ($semver.Groups[5].Success) {
            [int]$semver.Groups[5].Value
          } else {
            0
          }

          $revision = switch ($channel) {
            "alpha" { $channelNumber }
            "beta"  { 99 + $channelNumber }
            "rc"    { 199 + $channelNumber }
            default { 300 }
          }

          $expectedWindowsVersion = "$major.$minor.$patch.$revision"
          $versionInfo = (Get-Item (Join-Path $verify "ALTRunNext.exe")).VersionInfo

          $fileVersion = "$($versionInfo.FileMajorPart).$($versionInfo.FileMinorPart).$($versionInfo.FileBuildPart).$($versionInfo.FilePrivatePart)"
          $productVersion = "$($versionInfo.ProductMajorPart).$($versionInfo.ProductMinorPart).$($versionInfo.ProductBuildPart).$($versionInfo.ProductPrivatePart)"

          if ($fileVersion -ne $expectedWindowsVersion) {
            throw "EXE fixed FileVersion '$fileVersion' does not match '$expectedWindowsVersion'."
          }
          if ($productVersion -ne $expectedWindowsVersion) {
            throw "EXE fixed ProductVersion '$productVersion' does not match '$expectedWindowsVersion'."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ALTRunNext-${{ matrix.arch }}
          path: ALTRunNext-${{ matrix.arch }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare checksums
        shell: bash
        run: |
          find artifacts -type f -name 'ALTRunNext-x64.zip' -exec cp {} ALTRunNext-x64.zip \;
          find artifacts -type f -name 'ALTRunNext-ARM64.zip' -exec cp {} ALTRunNext-ARM64.zip \;
          test -f ALTRunNext-x64.zip
          test -f ALTRunNext-ARM64.zip
          sha256sum ALTRunNext-x64.zip ALTRunNext-ARM64.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: ALTRun Next ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            ALTRunNext-x64.zip
            ALTRunNext-ARM64.zip
            SHA256SUMS.txt
